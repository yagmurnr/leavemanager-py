{% extends "base.html" %}
{% block content %}
<h3>Giriş</h3>
{% for message in get_flashed_messages() %}<p>{{ message }}</p>{% endfor %}
{% if error %}<p style='color:red'>{{ error }}</p>{% endif %}
<form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">Kullanıcı adı</label>: <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" autofocus><br><br>
    <label for="password">Şifre</label>: <input type="password" id="password" name="password" autocomplete="current-password"><br><br>
    <input type="submit" value="Giriş"></form>
{% endblock %}
