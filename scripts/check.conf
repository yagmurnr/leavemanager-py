# scripts/check.conf — ./scripts/check'in adımları (docs/testing.md).
# Kaynak temizliği envanteri: ruff tek seferlik çalışır, arka planda süreç bırakmaz. smoke, uygulamayı
# Flask test client ile süreç içinde çağırır; sunucu açmaz, port dinlemez. Veri bellekte durur ve
# her çalıştırmada seed() ile sıfırdan kurulur, bir çalıştırmadan diğerine bir şey taşınmaz (kural 5).
# test: pytest, tests/ altındaki her testi çalıştırır (pytest.ini testpaths); -p no:cacheprovider: kural 5, .pytest_cache bırakmaz.
lint [fast]: "$(scripts/py)" -m ruff check .
test [fast]: "$(scripts/py)" -m pytest -q -p no:cacheprovider
smoke [fast]: "$(scripts/py)" -c "import app; c = app.app.test_client(); [print(p, r.status_code) or (r.status_code == 200 and b'LeaveManager' in r.data) or exit('smoke FAILED: ' + p) for p in ('/', '/requests', '/new') for r in [c.get(p)]]"
